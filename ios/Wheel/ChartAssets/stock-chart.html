<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#111318;color:#eee;font:12px -apple-system}#chart{position:absolute;inset:0} .handle{position:absolute;left:8px;min-height:40px;min-width:150px;padding:10px 12px;border-radius:7px;border:1px solid currentColor;background:#15221fee;color:#49dba2;font-weight:600;touch-action:none;cursor:ns-resize;z-index:4}#sl{color:#ff6b79;background:#301c22ee}.handle:focus{outline:2px solid #fff}#readout{position:absolute;left:10px;top:5px;z-index:3;pointer-events:none;font-size:11px;color:#aaa}.handle small{opacity:.7}#empty{position:absolute;inset:40% 20px auto;text-align:center;color:#aaa}
</style></head><body><div id="chart"></div><div id="readout"></div><div id="empty"></div><button class="handle" id="tp" hidden></button><button class="handle" id="sl" hidden></button><script>/*LIBRARY*/</script><script>
const chart=LightweightCharts.createChart(document.getElementById('chart'),{autoSize:true,layout:{background:{color:'#111318'},textColor:'#aeb6c6',attributionLogo:true},grid:{vertLines:{color:'#21242b'},horzLines:{color:'#21242b'}},rightPriceScale:{scaleMargins:{top:.18,bottom:.18}},timeScale:{timeVisible:true,secondsVisible:false,tickMarkFormatter:t=>new Date(t*1000).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false})},localization:{timeFormatter:t=>new Date(t*1000).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}});
const series=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#27ca91',downColor:'#f05c72',borderVisible:false,wickUpColor:'#27ca91',wickDownColor:'#f05c72'});
let key='', previous=[], entry=0, qty=1, levels={tp:0,sl:0}, lines={}, entryLine=null, dragging=null;
const amount=p=>(p-entry)*qty;
function label(k){return k.toUpperCase()+'  $'+levels[k].toFixed(2)+'  '+(amount(levels[k])>=0?'+':'−')+'$'+Math.abs(amount(levels[k])).toFixed(2)}
function updateLines(){
 if(!entry||!qty||!previous.length){for(const k of ['tp','sl']){document.getElementById(k).hidden=true;if(lines[k])series.removePriceLine(lines[k]);}lines={};if(entryLine)series.removePriceLine(entryLine);entryLine=null;return;}
 if(!levels.tp){const recent=previous.slice(-70);const span=Math.max(...recent.map(b=>b.high))-Math.min(...recent.map(b=>b.low));const offset=Math.max(.01,span*.25);levels.tp=Math.round((entry+offset)*100)/100;levels.sl=Math.max(.01,Math.round((entry-offset)*100)/100);}
 for(const k of ['tp','sl']){const options={price:levels[k],color:k==='tp'?'#27ca91':'#f05c72',lineWidth:2,lineStyle:2,axisLabelVisible:true,title:k.toUpperCase()};if(lines[k])lines[k].applyOptions(options);else lines[k]=series.createPriceLine(options);const h=document.getElementById(k);h.hidden=false;h.textContent=label(k);h.setAttribute('aria-label',label(k));}
 if(entryLine)entryLine.applyOptions({price:entry});else entryLine=series.createPriceLine({price:entry,color:'#96a2b9',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'Entry'});
}
window.configure=(config)=>{const changed=entry!==config.entry;entry=config.entry;qty=config.quantity;if(changed){levels={tp:0,sl:0};}const dark=config.dark;chart.applyOptions({layout:{background:{color:dark?'#111318':'#ffffff'},textColor:dark?'#aeb6c6':'#455166'},grid:{vertLines:{color:dark?'#21242b':'#edf0f5'},horzLines:{color:dark?'#21242b':'#edf0f5'}}});document.body.style.background=dark?'#111318':'white';updateLines();};
window.receive=(packet)=>{const bars=packet.bars||[];const newKey=packet.generation+'-'+packet.interval+'-'+packet.session;if(key!==newKey||!previous.length){key=newKey;series.setData(bars);chart.timeScale().setVisibleLogicalRange({from:Math.max(0,bars.length-70),to:bars.length+8});}else if(bars.length){const last=previous[previous.length-1].time;for(const b of bars)if(b.time>=last)series.update(b);}previous=bars;document.getElementById('empty').textContent=bars.length?'':'No bars for this session';updateLines();};
chart.subscribeCrosshairMove(p=>{const b=p.seriesData.get(series);document.getElementById('readout').textContent=b&&b.open!==undefined?`O ${b.open.toFixed(2)}  H ${b.high.toFixed(2)}  L ${b.low.toFixed(2)}  C ${b.close.toFixed(2)}`:'';});
function move(k,y){const price=series.coordinateToPrice(y);if(!Number.isFinite(price)||price<=0)return;levels[k]=Math.round((k==='tp'?Math.max(entry+.01,price):Math.min(entry-.01,price))*100)/100;levels[k]=Math.max(.01,levels[k]);updateLines();}
for(const k of ['tp','sl']){const h=document.getElementById(k);h.addEventListener('pointerdown',e=>{dragging=k;h.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();});h.addEventListener('pointermove',e=>{if(dragging===k){move(k,e.clientY);e.preventDefault();}});for(const type of ['pointerup','pointercancel','lostpointercapture'])h.addEventListener(type,()=>dragging=null);h.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){move(k,series.priceToCoordinate(levels[k]+(e.key==='ArrowUp'?.01:-.01)));e.preventDefault();}});}
function position(){for(const k of ['tp','sl']){const y=series.priceToCoordinate(levels[k]);const h=document.getElementById(k);if(y!==null)h.style.top=Math.min(innerHeight-44,Math.max(30,y-20))+'px';}requestAnimationFrame(position);}position();
window.webkit?.messageHandlers.chartReady.postMessage('ready');
</script></body></html>
