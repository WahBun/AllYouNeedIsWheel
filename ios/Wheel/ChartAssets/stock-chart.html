// Long press any order segment, including its cancel cell, to drag without activating it.
let orderHold=null,suppressOrderClickUntil=0;
function clearOrderHold(){if(orderHold)clearTimeout(orderHold.timer);orderHold=null;}

const latestPriceLine=document.createElement('div');latestPriceLine.id='latest-price-line';latestPriceLine.style.cssText='position:absolute;pointer-events:none;z-index:1;border-top:1px dashed #303332';latestPriceLine.hidden=true;document.body.append(latestPriceLine);
function updateLatestPriceLine(){
 const bar=previous.at(-1),right=chart.timeScale().width();
 const x=bar?chart.timeScale().logicalToCoordinate(previous.length-1):null,y=bar?series.priceToCoordinate(bar.close):null;

function updateCountdown(){const el=document.getElementById('countdown'),bar=previous.at(-1);el.hidden=!bar;if(!bar)return;const down=bar.close<bar.open;el.style.background=down?series.options().downColor:'#e0e0e0';el.style.color=down?'#f4f5f3':'#242424';const y=series.priceToCoordinate(bar.close);el.hidden=y===null||y<9||y>innerHeight-50;if(el.hidden)return;el.style.top=(y-9)+'px';el.style.width=axisBadgeWidth()+'px';document.getElementById('countdown-price').textContent=priceText(bar.close);const p=countdownPacket,elapsed=Math.max(0,(Date.now()-countdownReceived)/1000),left=p?.bar_closes_at-(p?.server_time+elapsed),timer=document.getElementById('countdown-time');timer.hidden=!(Number.isFinite(left)&&left>0);timer.textContent=timer.hidden?'':formatCountdown(Math.ceil(left));}
function formatCountdown(s){const days=Math.floor(s/86400);const hours=Math.floor(s%86400/3600);const mins=Math.floor(s%3600/60);const secs=s%60;return days?days+'d '+hours+'h':hours?hours+':'+String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0'):String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');}
// WebKit suspends animation frames in the background. Reconcile immediately on

function latestBarLogical(){const time=previous.at(-1)?.time;if(time===undefined)return null;const x=chart.timeScale().timeToCoordinate(time);return x===null?null:chart.timeScale().coordinateToLogical(x);}
latestBarButton.onclick=()=>{const last=latestBarLogical();if(last===null)return;const r=chart.timeScale().getVisibleLogicalRange(),width=r?Math.max(5,r.to-r.from):70,right=last+Math.min(18,width*.2);chart.timeScale().setVisibleLogicalRange({from:right-width,to:right});chart.priceScale('right').applyOptions({autoScale:true});};
function updateLatestBarButton(){const r=chart.timeScale().getVisibleLogicalRange(),last=latestBarLogical();const y=previous.length?series.priceToCoordinate(previous.at(-1).close):null;const priceVisible=y!==null&&y>=0&&y<=chart.paneSize().height;latestBarButton.hidden=last===null||!r||(r.from<=last&&r.to>=last&&priceVisible&&chart.priceScale('right').options().autoScale);latestBarButton.style.right=(chart.priceScale('right').width()+12)+'px';}
// Visible candle extrema: use timestamps, since indicator-only points can shift logical indices.
let extremaBars=null,extremaRange='',extremaLines={};
function updateVisibleExtrema(){
 const range=chart.timeScale().getVisibleRange(),signature=range?range.from+':'+range.to:'';
 if(extremaBars===previous&&extremaRange===signature)return;
 extremaBars=previous;extremaRange=signature;
 let high=-Infinity,low=Infinity;
 if(range)for(const bar of previous){if(bar.time>=range.from&&bar.time<=range.to){high=Math.max(high,bar.high);low=Math.min(low,bar.low);}}
 for(const [name,price] of [['High',high],['Low',low]]){
  if(!Number.isFinite(price)){if(extremaLines[name]){series.removePriceLine(extremaLines[name]);delete extremaLines[name];}continue;}
  const options={price,title:name,color:'#e3eef8',axisLabelColor:'#e3eef8',axisLabelTextColor:'#242424',lineVisible:false,axisLabelVisible:true};

 }

// A WKWebView changes size in place when native full-screen controls appear.
// Resize the canvas and restore the time window together; stale manual Y scaling
// must not carry the full-screen pixel range into the shorter chart.
let viewportFrame=0,lastViewportWidth=0,lastViewportHeight=0,nativeViewport=null,pendingNativeState=null;
function applyViewport(width,height){
 width=Math.floor(width);height=Math.floor(height);
 if(width<1||height<1||width===lastViewportWidth&&height===lastViewportHeight)return;
 const range=chart.timeScale().getVisibleLogicalRange();
 lastViewportWidth=width;lastViewportHeight=height;
 chart.resize(width,height,true);chart.priceScale('right').applyOptions({autoScale:true});
 if(range)chart.timeScale().setVisibleLogicalRange(range);

}
window.setNativeViewport=(width,height)=>{
 if(!(width>0&&height>0))return;

 const host=document.getElementById('chart');host.style.width=width+'px';host.style.height=height+'px';
 applyViewport(width,height);
 if(pendingNativeState){const state=pendingNativeState;pendingNativeState=null;window.applyChartState({...state,width,height});}
};
window.applyChartState=state=>{
 if(!(state.width>0&&state.height>0)){pendingNativeState=state;return;}
 window.setNativeViewport(state.width,state.height);
 if(state.config&&Object.keys(state.config).length)window.configure(state.config);

};
function resizeViewport(){
