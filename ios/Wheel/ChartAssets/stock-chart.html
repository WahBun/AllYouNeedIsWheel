 }

let readoutTime=null,readoutLatest=false;
function updateReadout(){
 const b=readoutLatest?previous.at(-1):previous.find(b=>b.time===readoutTime);

function handleReadoutMove(p){

// Price-axis order entry: explicit side and type at the selected tick price.
const priceAdd=document.createElement('button'),priceMenu=document.createElement('div');

let cursorOrderPrice=null,menuOrderPrice=null,menuOrderCID=null,priceControlTouchUntil=0;

function priceOrderChoices(price,reference){

function sendPriceOrder(choice){

 if(cid!==paperCID||!paperConfig.enabled||paperConfig.active||paperConfig.busy||!(qty>0)||!Number.isFinite(qty))return;

function updatePriceCursor(p){

function updateCountdown(){const el=document.getElementById('countdown'),bar=previous.at(-1);el.hidden=!bar;if(!bar)return;const down=bar.close<bar.open;el.style.background=down?series.options().downColor:'#e0e0e0';el.style.color=down?'#f4f5f3':'#242424';const y=series.priceToCoordinate(bar.close);el.hidden=y===null||y<9||y>innerHeight-50;if(el.hidden)return;el.style.top=(y-9)+'px';el.style.width='max-content';el.style.minWidth='42px';el.style.maxWidth=Math.max(42,innerWidth*.3)+'px';document.getElementById('countdown-price').textContent=priceText(bar.close);const p=countdownPacket,elapsed=Math.max(0,(Date.now()-countdownReceived)/1000),left=p?.bar_closes_at-(p?.server_time+elapsed),timer=document.getElementById('countdown-time');timer.hidden=!(Number.isFinite(left)&&left>0);timer.textContent=timer.hidden?'':formatCountdown(Math.ceil(left));}

function position(){const axisRight=Math.ceil(chart.priceScale('right').width())+7;for(const id of ['tp','sl','cancel'])document.getElementById(id).style.right=axisRight+'px';document.getElementById('entry').style.right=(axisRight+35)+'px';updateCountdown();for(const k of ['tp','sl','entry']){const y=series.priceToCoordinate(k==='entry'?entry:levels[k]);const h=document.getElementById(k);const onScreen=y!==null&&y>=12&&y<innerHeight-36;h.style.visibility=onScreen?'visible':'hidden';if(y!==null){h.style.top=(y-22)+'px';if(k==='entry'){const cancel=document.getElementById('cancel');cancel.style.top=h.style.top;cancel.style.visibility=h.style.visibility;}}}requestAnimationFrame(position);}position();
// A WKWebView changes size in place when native full-screen controls appear.
// Resize the canvas and restore the time window together; stale manual Y scaling
// must not carry the full-screen pixel range into the shorter chart.
let viewportFrame=0,lastViewportWidth=0,lastViewportHeight=0,nativeViewport=null,pendingNativeState=null;
function applyViewport(width,height){

 if(width<1||height<1||width===lastViewportWidth&&height===lastViewportHeight)return;
 const range=chart.timeScale().getVisibleLogicalRange();

window.setNativeViewport=(width,height)=>{

};
window.applyChartState=state=>{
 if(!(state.width>0&&state.height>0)){pendingNativeState=state;return;}

}
