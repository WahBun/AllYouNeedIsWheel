<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#b8b8b8;color:#171919;font:12px -apple-system}#chart{position:absolute;inset:0} .handle{position:absolute;right:64px;min-height:44px;min-width:0;padding:11px 0;border-radius:0;border:0;background:transparent;color:#176f64;font-weight:600;touch-action:none;cursor:ns-resize;z-index:4}#entry{color:#315fc4;right:92px}#cancel{position:absolute;right:57px;width:36px;height:44px;padding:0;border:0;background:transparent;color:#315fc4;font-size:19px;z-index:5;touch-action:manipulation}#cancel span{display:block;background:#f4f5f3;border:1px solid currentColor;border-radius:0 3px 3px 0;height:24px;line-height:21px}#sl{color:#9a5b25}.handle span{display:block;padding:4px 7px;border:1px solid currentColor;border-radius:3px;background:#f4f5f3f2;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 1px 2px #00000012}.handle:focus{outline:2px solid #fff}#readout{position:absolute;left:10px;top:5px;z-index:3;pointer-events:none;font-size:11px;color:#252b29}.handle small{opacity:.7}#empty{position:absolute;inset:40% 20px auto;text-align:center;color:#303332}
</style></head><body><div id="chart"></div><div id="readout"></div><div id="empty"></div><button class="handle" id="tp" hidden></button><button class="handle" id="sl" hidden></button><button class="handle" id="entry" hidden></button><button id="cancel" aria-label="Cancel preview" hidden><span>×</span></button><script>/*LIBRARY*/</script><script>
const chart=LightweightCharts.createChart(document.getElementById('chart'),{autoSize:true,layout:{background:{color:'#b8b8b8'},textColor:'#171919',fontSize:10,attributionLogo:true},grid:{vertLines:{visible:false},horzLines:{visible:false}},rightPriceScale:{borderVisible:false,scaleMargins:{top:.18,bottom:.18}},timeScale:{borderVisible:false,tickMarkMaxCharacterLength:5,timeVisible:true,secondsVisible:false,tickMarkFormatter:t=>new Date(t*1000).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false})},localization:{timeFormatter:t=>new Date(t*1000).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}});
const series=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#a8c8c0',downColor:'#303332',borderVisible:true,borderUpColor:'#182522',borderDownColor:'#303332',wickUpColor:'#242927',wickDownColor:'#242927'});
let key='', previous=[], entry=0, qty=1, levels={tp:0,sl:0}, lines={}, entryLine=null, dragging=null, entryType='LMT', side=1, sideReady=false, canceled=false, lastJoinRevision=0;
function setSide(next){if(next!==side){const profit=Math.max(.01,Math.abs(levels.tp-entry));const risk=Math.max(.01,Math.abs(levels.sl-entry));side=next;if(levels.tp){levels.tp=Math.max(.01,entry+side*profit);levels.sl=Math.max(.01,entry-side*risk);}}sideReady=true;}
function inferSide(){const ref=previous.at(-1)?.close;if(!ref||entry===ref)return;setSide((entryType==='LMT'?entry<ref:entry>ref)?1:-1);}
function clampLevels(){if(!levels.tp)return;levels.tp=Math.max(.01,side>0?Math.max(levels.tp,entry+.01):Math.min(levels.tp,entry-.01));levels.sl=Math.max(.01,side>0?Math.min(levels.sl,entry-.01):Math.max(levels.sl,entry+.01));}
const amount=p=>(p-entry)*qty*side;
function label(k){return k.toUpperCase()+'  $'+levels[k].toFixed(2)+'  '+(amount(levels[k])>=0?'+':'−')+'$'+Math.abs(amount(levels[k])).toFixed(2)}
function updateLines(){
 document.getElementById('cancel').hidden=canceled||!entry||!qty||!previous.length;
 if(canceled||!entry||!qty||!previous.length){document.getElementById('entry').hidden=true;for(const k of ['tp','sl']){document.getElementById(k).hidden=true;if(lines[k])series.removePriceLine(lines[k]);}lines={};if(entryLine)series.removePriceLine(entryLine);entryLine=null;return;}
 if(!levels.tp){const recent=previous.slice(-70);const span=Math.max(...recent.map(b=>b.high))-Math.min(...recent.map(b=>b.low));const offset=Math.max(.01,span*.25);levels.tp=Math.round((entry+side*offset)*100)/100;levels.sl=Math.max(.01,Math.round((entry-side*offset)*100)/100);}
 for(const k of ['tp','sl']){const options={price:levels[k],color:k==='tp'?'#72aaa1':'#c8986c',lineWidth:1,lineStyle:2,axisLabelVisible:false,title:k.toUpperCase()};if(lines[k])lines[k].applyOptions(options);else lines[k]=series.createPriceLine(options);const h=document.getElementById(k);h.hidden=false;h.replaceChildren(Object.assign(document.createElement('span'),{textContent:label(k)}));h.setAttribute('aria-label',label(k));}
 const eh=document.getElementById('entry');eh.hidden=false;const color=side>0?'#315fc4':'#c6384d';eh.style.color=color;document.getElementById('cancel').style.color=color;eh.replaceChildren(Object.assign(document.createElement('span'),{textContent:(side>0?'Buy ':'Sell ')+entryType+'  $'+entry.toFixed(2)+'  × '+qty}));
 if(entryLine)entryLine.applyOptions({price:entry,title:entryType,color});else entryLine=series.createPriceLine({price:entry,color,lineWidth:1,lineStyle:2,axisLabelVisible:false,title:entryType});
}
window.configure=(config)=>{if(config.entry===0)canceled=false;const changed=entry!==config.entry||entryType!==(config.entryType||'LMT');entry=config.entry;qty=config.quantity;entryType=config.entryType||'LMT';if(config.joinRevision>lastJoinRevision&&(config.joinSide===1||config.joinSide===-1)){lastJoinRevision=config.joinRevision;setSide(config.joinSide);clampLevels();}else if(changed){inferSide();clampLevels();}updateLines();};
window.receive=(packet)=>{const bars=packet.bars||[];chart.applyOptions({timeScale:{timeVisible:!(packet.interval>=1440||(packet.interval===480&&packet.session==='rth')),tickMarkFormatter:t=>new Date(t*1000).toLocaleString('en-US',(packet.interval>=1440||(packet.interval===480&&packet.session==='rth'))?{timeZone:'America/New_York',month:'short',day:'numeric',year:'2-digit'}:{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false})}});const newKey=packet.generation+'-'+packet.interval+'-'+packet.session;if(key!==newKey||!previous.length){key=newKey;series.setData(bars);chart.timeScale().setVisibleLogicalRange({from:Math.max(0,bars.length-70),to:bars.length+18});}else if(bars.length){const last=previous[previous.length-1].time;for(const b of bars)if(b.time>=last)series.update(b);}previous=bars;if(!sideReady){inferSide();clampLevels();}document.getElementById('empty').textContent=bars.length?'':'No bars for this session';updateLines();};
chart.subscribeCrosshairMove(p=>{const b=p.seriesData.get(series);document.getElementById('readout').textContent=b&&b.open!==undefined?`${new Date(b.time*1000).toLocaleString('en-US',{timeZone:'America/New_York',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})} NY · O ${b.open.toFixed(2)}  H ${b.high.toFixed(2)}  L ${b.low.toFixed(2)}  C ${b.close.toFixed(2)}`:'';});
function move(k,y){const price=series.coordinateToPrice(y);if(!Number.isFinite(price)||price<=0)return;if(k==='entry'){entry=Math.max(.02,Math.round(price*100)/100);inferSide();clampLevels();updateLines();window.webkit?.messageHandlers.entryChanged?.postMessage(entry);return;}levels[k]=Math.round(((k==='tp')===(side>0)?Math.max(entry+.01,price):Math.min(entry-.01,price))*100)/100;levels[k]=Math.max(.01,levels[k]);updateLines();}
for(const k of ['tp','sl','entry']){const h=document.getElementById(k);h.addEventListener('pointerdown',e=>{dragging=k;h.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();});h.addEventListener('pointermove',e=>{if(dragging===k){move(k,e.clientY);e.preventDefault();}});for(const type of ['pointerup','pointercancel','lostpointercapture'])h.addEventListener(type,()=>dragging=null);h.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){move(k,series.priceToCoordinate((k==='entry'?entry:levels[k])+(e.key==='ArrowUp'?.01:-.01)));e.preventDefault();}});}
document.getElementById('cancel').addEventListener('click',()=>{canceled=true;dragging=null;levels={tp:0,sl:0};updateLines();window.webkit?.messageHandlers.entryChanged?.postMessage(0);});
function position(){for(const k of ['tp','sl','entry']){const y=series.priceToCoordinate(k==='entry'?entry:levels[k]);const h=document.getElementById(k);if(y!==null){h.style.top=Math.min(innerHeight-48,Math.max(18,y-22))+'px';if(k==='entry')document.getElementById('cancel').style.top=h.style.top;}}requestAnimationFrame(position);}position();
window.webkit?.messageHandlers.chartReady.postMessage('ready');
</script></body></html>
