</style></head><body><div id="chart"></div><div id="chart-title" style="position:absolute;top:5px;left:8px;z-index:3;pointer-events:none;font-size:11px"></div><div id="paper-status" role="status" style="position:absolute;left:10px;top:39px;z-index:6;pointer-events:none;font-size:11px;background:#f4f5f3e6;padding:3px 5px;border-radius:3px" hidden></div><div id="readout"></div><div id="empty"></div><div id="validation" role="status" style="position:absolute;left:10px;right:55px;top:26px;z-index:6;color:#8b301c;background:#f4f5f3;padding:6px;display:none"></div><div id="countdown" hidden><span id="countdown-price"></span><span id="countdown-time" hidden></span></div><button class="handle" id="tp" hidden></button><button class="handle" id="sl" hidden></button><button class="handle" id="entry" hidden></button><button id="cancel" aria-label="Cancel preview" hidden><span>×</span></button><script>/*LIBRARY*/</script><script>
// The chart is an interaction surface, not selectable document content.

});
const chart=LightweightCharts.createChart(document.getElementById('chart'),{autoSize:false,crosshair:{mode:LightweightCharts.CrosshairMode.Normal},layout:{background:{color:'#b8b8b8'},textColor:'#171919',fontSize:10,attributionLogo:true},grid:{vertLines:{visible:false},horzLines:{visible:false}},rightPriceScale:{borderVisible:false,scaleMargins:{top:.18,bottom:.18}},timeScale:{borderVisible:false,tickMarkMaxCharacterLength:5,timeVisible:true,secondsVisible:false,tickMarkFormatter:t=>new Date(t*1000).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false})},localization:{timeFormatter:t=>new Date(t*1000).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}});
const series=chart.addSeries(LightweightCharts.CandlestickSeries,{lastValueVisible:false,upColor:'rgba(0,0,0,0)',downColor:'#303332',borderVisible:true,borderUpColor:'#303332',borderDownColor:'#303332',wickUpColor:'#303332',wickDownColor:'#303332',priceLineColor:'#303332'});
const executionMarkers=LightweightCharts.createSeriesMarkers(series,[],{autoScale:false});
let executionFingerprint='';
function updateExecutionMarks(){
 const fills=countdownPacket?.con_id===paperCID?(paperConfig.executions||[]):[];
 const marks=[];
 for(const fill of fills){
  if(!previous.length||fill.time<previous[0].time)continue;
  let lo=0,hi=previous.length-1;
  while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(previous[mid].time<=fill.time)lo=mid;else hi=mid-1;}
  const bar=previous[lo];if(fill.time>=bar.time+(countdownPacket?.interval||1)*60)continue;
  const buy=fill.side==='BUY';
  marks.push({id:fill.id,time:bar.time,position:buy?'belowBar':'aboveBar',color:buy?'#315fc4':'#d63950',shape:buy?'arrowUp':'arrowDown',text:fill.quantity+' @ '+priceText(fill.price)});
 }
 marks.sort((a,b)=>a.time-b.time);
 const fingerprint=JSON.stringify(marks);if(fingerprint!==executionFingerprint){executionFingerprint=fingerprint;executionMarkers.setMarkers(marks);}
}
let countdownPacket=null, countdownReceived=0;
let key='', previous=[], entry=0, qty=1, contractMultiplier=1, levels={tp:0,sl:0}, lines={}, entryLine=null, dragging=null, entryType='LMT', side=1, sideReady=false, canceled=false, lastJoinRevision=0, lastBERevision=0, breakEven=false, template={tp:0,sl:0}, templateVersion=0, appliedTemplate=0, lastBEState=null;
let priceRules=[];
function tickAt(p){return priceRules.filter(r=>Number.isFinite(r.low)&&r.low<=p&&r.increment>0).sort((a,b)=>b.low-a.low)[0]?.increment;}
function snapPrice(p,direction=0){if(!Number.isFinite(p)||p<=0)return null;for(let i=0;i<8;i++){const tick=tickAt(p);if(!tick)return null;const units=p/tick;const next=Number(((direction>0?Math.ceil(units-1e-8):direction<0?Math.floor(units+1e-8):Math.round(units))*tick).toFixed(8));if(next<=0)return null;if(tickAt(next)===tick)return next;p=next;}return null;}
function stepPrice(p,direction){const tick=tickAt(direction<0?p-1e-8:p);return tick?snapPrice(p+direction*tick,direction):null;}
function priceText(p){const tick=tickAt(p);const digits=tick?Math.max(2,Math.min(8,((tick.toFixed(8).replace(/0+$/,'').split('.')[1])||'').length)):8;return p.toFixed(tick?digits:2);/* Display fallback only: unknown increments still cannot snap orders. */}
function validation(message=''){const el=document.getElementById('validation');el.textContent=message;el.style.display=message?'block':'none';}
function setSide(next){if(next!==side){side=next;levels={tp:0,sl:0};appliedTemplate=-1;breakEven=false;}sideReady=true;}
function inferSide(){const ref=previous.at(-1)?.close;if(!ref||entry===ref)return;setSide((entryType==='LMT'?entry<ref:entry>ref)?1:-1);}
function clampLevels(){if(!levels.tp)return;const edge=stepPrice(entry,side);if(edge!==null)levels.tp=snapPrice(side>0?Math.max(levels.tp,edge):Math.min(levels.tp,edge));/* SL may intentionally lock profit. */}
const amount=p=>(p-entry)*qty*side*contractMultiplier;
function label(k){return k.toUpperCase()+'  $'+priceText(levels[k])+'  '+(amount(levels[k])>=0?'+':'−')+'$'+Math.abs(amount(levels[k])).toFixed(2)}
function applyTemplate(){if(!tickAt(entry)){validation('Waiting for contract price increments');return false;}appliedTemplate=templateVersion;const tp=snapPrice(entry+side*template.tp),sl=snapPrice(entry-side*template.sl);if(!(template.tp>0&&template.sl>0)||tp===null||sl===null||side*(tp-entry)<=0||side*(sl-entry)>=0){validation('Invalid TP / SL distance. Previous levels unchanged; edit the template and apply again.');return false;}levels={tp,sl};breakEven=false;validation();return true;}
function syncBE(){const applied=breakEven&&entry>0&&!canceled;if(applied!==lastBEState){lastBEState=applied;window.webkit?.messageHandlers.beState?.postMessage(applied);}}
function updateLines(){
 syncBE();
 document.getElementById('cancel').hidden=canceled||!entry||!qty||!previous.length;
 if(canceled||!entry||!qty||!previous.length){document.getElementById('entry').hidden=true;for(const k of ['tp','sl']){document.getElementById(k).hidden=true;if(lines[k])series.removePriceLine(lines[k]);}lines={};if(entryLine)series.removePriceLine(entryLine);entryLine=null;return;}
 if(!paperConfig.active&&(templateVersion>appliedTemplate||(!levels.tp&&appliedTemplate!==templateVersion)))applyTemplate();
 for(const k of ['tp','sl']){if(!levels[k]){document.getElementById(k).hidden=true;if(lines[k]){series.removePriceLine(lines[k]);delete lines[k];}continue;}const options={price:levels[k],color:k==='tp'?'#72aaa1':'#c8986c',lineWidth:1,lineStyle:2,axisLabelVisible:false,title:k.toUpperCase()};if(lines[k])lines[k].applyOptions(options);else lines[k]=series.createPriceLine(options);const h=document.getElementById(k);h.hidden=false;h.replaceChildren(Object.assign(document.createElement('span'),{textContent:label(k)}));h.setAttribute('aria-label',label(k));}
 syncBE();const eh=document.getElementById('entry');eh.hidden=false;const color=side>0?'#315fc4':'#c6384d';eh.style.color=color;document.getElementById('cancel').style.color=color;eh.replaceChildren(Object.assign(document.createElement('span'),{textContent:(paperConfig.position?(paperConfig.position>0?'Long ':'Short '):(side>0?'Buy ':'Sell ')+entryType+' ')+ ' $'+priceText(entry)+'  × '+(paperConfig.position?Math.abs(paperConfig.position):qty)}));
 if(entryLine)entryLine.applyOptions({price:entry,title:entryType,color});else entryLine=series.createPriceLine({price:entry,color,lineWidth:1,lineStyle:2,axisLabelVisible:false,title:entryType});
}
let paperConfig={},paperCID=0;
function paperAction(body){window.webkit?.messageHandlers.paperAction?.postMessage({...body,con_id:paperCID});}
let appliedPriceFormat=null;
function updatePaperStatus(){
 const rows=paperConfig.orders||[],parent=rows.find(r=>r.role==='entry'),exit=rows.find(r=>['tp','sl','close'].includes(r.role)&&r.filled>0);
 let status='';
 if(paperConfig.sync_error)status='Order updates paused · verify Gateway';
 else if(paperConfig.known===false)status='Order status unknown · verify Gateway';
 else if(paperConfig.rejected)status='Order rejected · verify Gateway';
 else if(paperConfig.position)status='IB Paper · '+(paperConfig.position>0?'Long ':'Short ')+Math.abs(paperConfig.position)+' filled';
 else if(paperConfig.status==='done'&&exit)status='IB Paper · '+exit.role.toUpperCase()+' filled · Flat';
 else if(paperConfig.status==='done')status='IB Paper · Orders finished · Flat';
 else if(parent)status='IB Paper · '+parent.status+' · Filled '+parent.filled;
 const el=document.getElementById('paper-status');el.textContent=status;el.hidden=!status;
}
window.configure=(config)=>{contractMultiplier=config.multiplier||1;paperConfig=config.paper||{};paperCID=config.con_id||0;updatePaperStatus();updateExecutionMarks();let submitPaper=false;if(dragging==='entry')config={...config,entry};priceRules=config.priceRules||priceRules;const formatKey=JSON.stringify(priceRules);if(appliedPriceFormat!==formatKey){appliedPriceFormat=formatKey;series.applyOptions({priceFormat:{type:'custom',minMove:priceRules.length?Math.min(...priceRules.map(r=>r.increment)):.01,formatter:priceText}});}template={tp:config.tpDistance||0,sl:config.slDistance||0};templateVersion=config.templateRevision||0;if(config.entry===0){canceled=false;levels={tp:0,sl:0};appliedTemplate=-1;breakEven=false;dragging=null;validation();}const changed=entry!==config.entry||entryType!==(config.entryType||'LMT');const snapped=config.entry>0?snapPrice(config.entry):0;entry=snapped??config.entry;if(snapped!==null&&snapped!==config.entry)window.webkit?.messageHandlers.entryChanged?.postMessage(snapped);qty=config.quantity;entryType=config.entryType||'LMT';if(changed){breakEven=false;if(!levels.tp)appliedTemplate=-1;}if(config.beRevision>lastBERevision){lastBERevision=config.beRevision;const target=stepPrice(entry,side);if(target!==null){levels.sl=target;breakEven=true;}}if(config.joinRevision>lastJoinRevision&&(config.joinSide===1||config.joinSide===-1)){lastJoinRevision=config.joinRevision;submitPaper=paperConfig.enabled===true&&!paperConfig.active;breakEven=false;canceled=false;levels={tp:0,sl:0};appliedTemplate=-1;setSide(config.joinSide);}else if(changed){inferSide();clampLevels();}
 if(paperConfig.active&&paperConfig.entry>0){entry=paperConfig.entry;side=paperConfig.side;breakEven=paperConfig.be_applied===true;if(!dragging){levels={tp:paperConfig.tp,sl:paperConfig.sl};}canceled=false;}
 updateLines();
 document.getElementById('entry').style.pointerEvents=paperConfig.active?'none':'auto';
 for(const role of ['tp','sl','cancel'])document.getElementById(role).style.pointerEvents=paperConfig.busy?'none':'auto';
 if(submitPaper)paperAction({action:'submit',entry,quantity:qty,side,entry_type:entryType,tp:levels.tp,sl:levels.sl});
};
window.receive=(packet)=>{if(countdownPacket?.server_time!==packet.server_time){countdownReceived=performance.now();}countdownPacket=packet;document.getElementById('chart-title').textContent=[packet.local_symbol||packet.symbol,packet.interval<60?String(packet.interval):packet.interval<1440?(packet.interval/60)+'h':packet.interval===1440?'D':packet.interval===10080?'W':'M',packet.exchange].filter(Boolean).join(' · ');let bars=packet.bars||[];
 const incomingKey=(packet.con_id||'')+'-'+packet.generation+'-'+packet.interval+'-'+packet.session;
 if(packet.mode==='delta'&&key===incomingKey&&previous.length&&bars.every(b=>b.time>=previous.at(-1).time)){
  for(const b of bars){series.update(b);if(b.time===previous.at(-1).time)previous[previous.length-1]=b;else previous.push(b);}
  if(!sideReady){inferSide();clampLevels();}updateLines();return;
 }
 if(packet.mode==='delta'&&key===incomingKey){const merged=new Map(previous.map(b=>[b.time,b]));for(const b of bars)merged.set(b.time,b);bars=[...merged.values()].sort((a,b)=>a.time-b.time);}chart.applyOptions({timeScale:{timeVisible:!(packet.interval>=1440||(packet.interval===480&&packet.session==='rth')),tickMarkFormatter:t=>new Date(t*1000).toLocaleString('en-US',(packet.interval>=1440||(packet.interval===480&&packet.session==='rth'))?{timeZone:'America/New_York',month:'short',day:'numeric',year:'2-digit'}:{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false})}});const newKey=(packet.con_id||'')+'-'+packet.generation+'-'+packet.interval+'-'+packet.session;if(key!==newKey||!previous.length){key=newKey;chart.clearCrosshairPosition();document.getElementById('readout').textContent='';chart.priceScale('right').applyOptions({autoScale:true});series.setData(bars);chart.timeScale().setVisibleLogicalRange({from:Math.max(0,bars.length-70),to:bars.length+18});}else if(bars.length&&bars[0].time<previous[0].time){const range=chart.timeScale().getVisibleLogicalRange();const offset=bars.findIndex(b=>b.time===previous[0].time);series.setData(bars);if(range&&offset>=0)chart.timeScale().setVisibleLogicalRange({from:range.from+offset,to:range.to+offset});}else if(bars.length){const last=previous[previous.length-1].time;const old=new Map(previous.map(b=>[b.time,b]));const revised=bars.some(b=>b.time<last&&JSON.stringify(old.get(b.time))!==JSON.stringify(b));if(revised){const range=chart.timeScale().getVisibleLogicalRange();series.setData(bars);if(range)chart.timeScale().setVisibleLogicalRange(range);}else for(const b of bars)if(b.time>=last)series.update(b);}previous=bars;updateExecutionMarks();if(!sideReady){inferSide();clampLevels();}document.getElementById('empty').textContent=bars.length?'':'No bars for this session';updateLines();};
chart.subscribeCrosshairMove(p=>{const b=p.seriesData.get(series);document.getElementById('readout').textContent=b&&b.open!==undefined?`O ${priceText(b.open)}  H ${priceText(b.high)}  L ${priceText(b.low)}  C ${priceText(b.close)}`:'';});
function move(k,y){const raw=series.coordinateToPrice(y),price=snapPrice(raw);if(price===null){validation('Waiting for valid contract price increments');return;}validation();if(k==='entry'){breakEven=false;entry=price;inferSide();clampLevels();if(!levels.tp)appliedTemplate=-1;updateLines();if(dragging!=='entry')window.webkit?.messageHandlers.entryChanged?.postMessage(entry);return;}if(k==='sl')breakEven=false;const edge=stepPrice(entry,side);levels[k]=k==='tp'&&edge!==null?(side>0?Math.max(edge,price):Math.min(edge,price)):price;updateLines();}
for(const k of ['tp','sl','entry']){const h=document.getElementById(k);h.addEventListener('pointerdown',e=>{dragging=k;h.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation();});h.addEventListener('pointermove',e=>{if(dragging===k){move(k,e.clientY);e.preventDefault();}});for(const type of ['pointerup','pointercancel','lostpointercapture'])h.addEventListener(type,()=>{const role=dragging;const wasEntry=role==='entry';dragging=null;if(type==='pointerup'&&paperConfig.active&&['tp','sl'].includes(role))paperAction({action:'amend',role,price:levels[role]});if(wasEntry)window.webkit?.messageHandlers.entryChanged?.postMessage(entry);});h.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){move(k,series.priceToCoordinate(stepPrice(k==='entry'?entry:levels[k],e.key==='ArrowUp'?1:-1)));e.preventDefault();}});}
document.getElementById('cancel').addEventListener('click',()=>{if(paperConfig.active){paperAction({action:'close'});return;}canceled=true;dragging=null;levels={tp:0,sl:0};updateLines();window.webkit?.messageHandlers.entryChanged?.postMessage(0);});
function updateCountdown(){const el=document.getElementById('countdown'),bar=previous.at(-1);el.hidden=!bar;if(!bar)return;const y=series.priceToCoordinate(bar.close);el.hidden=y===null||y<9||y>innerHeight-50;if(el.hidden)return;el.style.top=(y-9)+'px';el.style.width='max-content';el.style.minWidth='42px';el.style.maxWidth=Math.max(42,innerWidth*.3)+'px';document.getElementById('countdown-price').textContent=priceText(bar.close);const p=countdownPacket,elapsed=(performance.now()-countdownReceived)/1000,left=p?.bar_closes_at-(p?.server_time+elapsed),timer=document.getElementById('countdown-time');timer.hidden=!(elapsed<3&&Number.isFinite(left)&&left>0);timer.textContent=timer.hidden?'':formatCountdown(Math.ceil(left));}
function formatCountdown(s){const days=Math.floor(s/86400);const hours=Math.floor(s%86400/3600);const mins=Math.floor(s%3600/60);const secs=s%60;return days?days+'d '+hours+'h':hours?hours+':'+String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0'):String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');}
function position(){const axisRight=Math.ceil(chart.priceScale('right').width())+7;for(const id of ['tp','sl','cancel'])document.getElementById(id).style.right=axisRight+'px';document.getElementById('entry').style.right=(axisRight+35)+'px';updateCountdown();for(const k of ['tp','sl','entry']){const y=series.priceToCoordinate(k==='entry'?entry:levels[k]);const h=document.getElementById(k);const onScreen=y!==null&&y>=12&&y<innerHeight-36;h.style.visibility=onScreen?'visible':'hidden';if(y!==null){h.style.top=(y-22)+'px';if(k==='entry'){const cancel=document.getElementById('cancel');cancel.style.top=h.style.top;cancel.style.visibility=h.style.visibility;}}}requestAnimationFrame(position);}position();
// A WKWebView changes size in place when native full-screen controls appear.
// Resize the canvas and restore the time window together; stale manual Y scaling
// must not carry the full-screen pixel range into the shorter chart.
let viewportFrame=0,lastViewportWidth=0,lastViewportHeight=0,nativeViewport=null,pendingNativeState=null;
function applyViewport(width,height){
 width=Math.floor(width);height=Math.floor(height);
 if(width<1||height<1||width===lastViewportWidth&&height===lastViewportHeight)return;
 const range=chart.timeScale().getVisibleLogicalRange();
 lastViewportWidth=width;lastViewportHeight=height;
 chart.resize(width,height,true);chart.priceScale('right').applyOptions({autoScale:true});
 if(range)chart.timeScale().setVisibleLogicalRange(range);
 chart.clearCrosshairPosition();document.getElementById('readout').textContent='';
 window.dispatchEvent(new Event('chart-viewport-resized'));
}
window.setNativeViewport=(width,height)=>{
 if(!(width>0&&height>0))return;
 nativeViewport={width,height};
 const host=document.getElementById('chart');host.style.width=width+'px';host.style.height=height+'px';
 applyViewport(width,height);
 if(pendingNativeState){const state=pendingNativeState;pendingNativeState=null;window.applyChartState({...state,width,height});}
};
window.applyChartState=state=>{
 if(!(state.width>0&&state.height>0)){pendingNativeState=state;return;}
 window.setNativeViewport(state.width,state.height);
 if(state.config&&Object.keys(state.config).length)window.configure(state.config);
 if(state.packet&&Object.keys(state.packet).length)window.receive(state.packet);
};
function resizeViewport(){
 cancelAnimationFrame(viewportFrame);viewportFrame=requestAnimationFrame(()=>{
  const bounds=nativeViewport||document.getElementById('chart').getBoundingClientRect();
  applyViewport(bounds.width,bounds.height);

}
new ResizeObserver(resizeViewport).observe(document.getElementById('chart'));
window.addEventListener('resize',resizeViewport);resizeViewport();
window.webkit?.messageHandlers.chartReady.postMessage('ready');
</script></body></html>
