<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wheel · Superchart</title><link rel="icon" type="image/png" href="/static/images/wheel-app-icon.png"><link rel="apple-touch-icon" href="/static/images/wheel-app-icon.png"><link rel="stylesheet" href="/static/css/superchart.css"></head>
<body><header><a href="/superchart">Wheel</a><strong>Superchart</strong><span id="connection">Connecting…</span><span class="spacer"></span><button id="theme">Light / Dark</button><button id="language">中文 / EN</button><button id="settings">⚙</button></header>
<main><section class="workspace"><nav><form id="search"><input id="symbol" placeholder="Symbol · QQQ/MNQ" aria-label="Symbol" required><button>Search</button></form><select id="contracts" aria-label="Contract"><option>Select contract</option></select><div id="intervals"></div><div class="interval-picker"><button id="interval" aria-label="Choose interval" aria-expanded="false">▾</button><div id="interval-menu" hidden></div></div><select id="session" aria-label="Session"><option value="rth">RTH</option><option value="all">ETH</option></select><button id="fullscreen">⛶</button></nav>
<div id="market-status" role="status">Select a symbol or a position to open the chart.</div><iframe id="chart" title="Superchart" src="/superchart/frame"></iframe><div class="chart-footer"><span id="order-status">View</span><button id="toggle-trade" aria-controls="chart-detail" aria-expanded="false">Detail ▾</button></div>
<section id="chart-detail" hidden>
<div><h2 data-en="Positions" data-zh="持仓">Positions</h2><div id="positions"></div></div>
<div><h2 data-en="Orders" data-zh="订单">Orders</h2><div id="orders"></div></div>
<details open><summary data-en="Activity" data-zh="操作记录">Activity</summary><div id="activity" aria-live="polite"></div><button id="copy">Copy diagnostics</button></details>
</section></section>
<aside id="trade"><div class="trade-heading"><h2 data-en="Trading" data-zh="交易">Trading</h2><div id="daily-pnl" tabindex="0"><span data-en="Daily P&amp;L" data-zh="当日盈亏">Daily P&amp;L</span><strong id="daily-pnl-value">—</strong><small id="daily-pnl-currency"></small></div></div>
<div class="trade-pair"><select id="order-group" aria-label="Chart order"><option value="">Original order</option></select><button id="new-order">＋ New order</button></div>
<label><span id="quantity-label">Quantity</span><div class="quantity-controls"><input id="quantity" type="number" min="1" max="1000" value="1"><button id="quantity-minus" aria-label="Decrease quantity">−</button><button id="quantity-plus" aria-label="Increase quantity">＋</button></div></label>
<div class="trade-pair"><label>Type <select id="type"><option>LMT</option><option>STP</option></select></label><label>TIF <select id="tif"><option>DAY</option><option>GTC</option><option value="OVERNIGHT">OVT</option></select></label></div>
<div class="trade-pair protection"><label>TP pts <input id="tp" type="number" min="0" value="0" step="any"></label><label>SL pts <input id="sl" type="number" min="0" value="0" step="any"></label></div>
<button id="preview">＋ Preview</button>
<div class="trade-pair join-actions"><button id="bid">Join Bid</button><button id="ask">Join Ask</button></div>
<label id="adjustment-control" hidden><span data-en="Add / Trim quantity" data-zh="加仓／减仓数量">Add / Trim quantity</span><input id="adjustment-quantity" type="number" min="1" step="1" value="1"></label>
<div class="position-actions"><button id="add">Add</button><button id="trim">Trim</button><button id="be">BE</button></div>
<button id="close">Close position</button><button id="resolve-request" hidden>Verify unresolved request…</button><p id="trade-feedback" role="status" aria-live="polite"></p></aside></main>
<dialog id="editor"><form id="edit-form"><h2>Edit order</h2><label>Quantity<input id="edit-qty" type="number" min="1" required></label><label>Price<input id="edit-price" type="number" step="any" min="0.000001" required></label><label>Time in force<select id="edit-tif"></select></label><label><input id="remove-protection" type="checkbox"> Confirm replacing with OVT without TP/SL</label><p>Quantity or TIF changes may cancel and replace the unfilled order.</p><button type="button" id="edit-cancel">Cancel</button><button type="submit">Apply</button></form></dialog>
<dialog id="display" aria-label="Chart settings"></dialog>
<script src="/static/js/chart-stream.js"></script><script src="/static/js/trade-sounds.js"></script><script src="/static/js/chart-settings.js"></script><script src="/static/js/superchart.js"></script></body></html>
